<script type="text/html" data-help-name="easye4json-device">
    <p>An easyE4 with web server, accessed via the <b>JSON API</b> (for older devices or firmware without MQTT).
        The nodes <i>easyE4 JSON read</i>, <i>write</i> and <i>action</i> refer to this entry.
        One entry per easyE4 is enough; all requests to this device run one after the other over one connection.</p>
    <h3>Settings</h3>
    <dl class="message-properties">
        <dt>Address</dt><dd>IP address or name of the easyE4, e.g. <code>192.168.178.50</code>.</dd>
        <dt>Protocol / Port</dt><dd><code>http</code> (port 80) or <code>https</code> (port 443), as set up for the web server
            in easySoft 7/8. Leave the port empty for the default.</dd>
        <dt>Verify certificate</dt><dd>Only for https. The easyE4 normally uses a self-signed certificate; then leave
            this <b>unchecked</b>.</dd>
        <dt>Login</dt><dd><b>User + password</b> (e.g. <code>admin</code> or a user created in easySoft 7/8),
            <b>API key</b> (firmware 1.11 or later) or <b>no login</b> (guest, read only and only if enabled).
            Credentials are stored encrypted by Node-RED and are not exported.</dd>
        <dt>Read via</dt><dd><i>automatic</i>: user <code>admin</code> reads via <code>/api/get/adm</code>, all others via
            <code>/api/get/data</code>. Only change if needed (e-mail settings are only available via <code>adm</code>).</dd>
        <dt>Timeout</dt><dd>How long to wait for an answer (default 3000 ms).</dd>
        <dt>Pause</dt><dd>Minimum gap between two requests (default 50 ms) so the web server of the easyE4 is not
            overloaded. Increase it if there are problems (e.g. 200).</dd>
    </dl>
    <p><b>Test connection</b> reads device name, firmware and operating mode without having to save first.</p>
    <h3>Permissions (easySoft 7/8)</h3>
    <ul>
        <li>Reading works for all users; inputs/outputs only with <i>Enable read I/O</i>.</li>
        <li>Writing markers: user with "read and write" permission and an enabled marker range.</li>
        <li>RUN/STOP or setting the clock: write permission for <i>mode</i> or <i>clock</i>.</li>
        <li>Changing the device name: <code>admin</code> only.</li>
    </ul>
    <h3>Overload protection</h3>
    <ul>
        <li>Only <b>one request at a time</b> goes to the same easyE4, over one connection – even if several controller
            entries use the same address.</li>
        <li>There is at least the configured <i>pause</i> between two requests.</li>
        <li>If the easyE4 is not reachable, it is asked less and less often (1 s, 2 s, 4 s … max. 10 s).</li>
        <li>If many write commands for the same operand arrive quickly (e.g. a slider), only the newest value is sent.</li>
        <li>A read node only asks again when its previous answer has arrived.</li>
    </ul>
    <h3>Status</h3>
    <p>The nodes show their last value (green), an error (red), "easyE4 not reachable" or "login rejected".</p>
    <h3>Disclaimer</h3>
    <p>Unofficial project, not affiliated with Eaton. Use at your own risk, without any liability. Details: <code>LICENSE</code> (MIT).</p>
</script>

<script type="text/html" data-help-name="easye4json-read">
    <p>Reads values from the easyE4 via the JSON API. The node polls by itself: every <i>x</i> seconds and/or on
        every incoming message.</p>
    <h3>What to read</h3>
    <dl class="message-properties">
        <dt>One operand</dt><dd>Type and number, e.g. <code>MW</code> <code>3</code>. For NET markers also the NET ID
            (0 = this device, 1–8 = NET station).</dd>
        <dt>Range</dt><dd>e.g. <code>MW1</code> to <code>MW8</code> → <code>{MW1: …, …, MW8: …}</code>. For bit operands
            (I, Q, M, N, ID) the node automatically requests whole bytes (e.g. I3–I6 as I1–I8), as the easyE4 requires,
            and outputs only the requested ones.</dd>
        <dt>All</dt><dd>All I, Q, AI, AO or M as one object.</dd>
        <dt>System information</dt><dd>Operating mode (<code>RUN</code>/<code>STOP</code>), firmware, date, time,
            cycle time, diagnostics …</dd>
        <dt>Function block pin</dt><dd>Block (e.g. <code>T</code>), number (<code>1</code>), pin type
            (0 bit input, 1 bit output, 2 word input, 3 word output) and pin no. (counted from the top, starting at 0).
            Example timing relay T1: <code>(1;0)</code> = Q1, <code>(2;0)</code> = I1, <code>(3;0)</code> = QV.
            Firmware 1.20 or later.</dd>
        <dt>Several (list)</dt><dd>Any mix, separated by commas, e.g.
            <code>M1, MW3, Q(1,4), N(2;5), STATE, T1(2;0)</code>. Everything is fetched with as few requests as possible.</dd>
        <dt>From the message</dt><dd>The same as text in <code>msg.topic</code> or <code>msg.payload</code>.</dd>
    </dl>
    <h3>Output</h3>
    <dl class="message-properties">
        <dt>payload</dt><dd>For one value the number (bits as 0/1), otherwise an object <code>{M1: 1, MW3: 42, STATE: "RUN"}</code>.
            Function block times in milliseconds, the parts are in <code>msg.time</code>.</dd>
        <dt>topic</dt><dd>Operand name (e.g. <code>MW3</code>, NET markers as <code>N(2;5)</code>, outputs as <code>Q1</code>).</dd>
        <dt>raw</dt><dd>The unchanged answer of the easyE4.</dd>
    </dl>
    <h3>Notes</h3>
    <ul>
        <li>The shortest poll interval is 0.5 s. Depending on the device the easyE4 answers only a few requests per
            second, shared by all nodes. So better read many values in <b>one</b> node with a <i>list</i>
            (one request instead of many) and poll only as often as needed.</li>
        <li>If a request is still running, the next automatic one is skipped.</li>
        <li>Errors (e.g. wrong number) are shown in red below the node and can be handled with a <i>catch</i> node.</li>
    </ul>
</script>

<script type="text/html" data-help-name="easye4json-write">
    <p>Writes a value to the easyE4 via the JSON API.</p>
    <h3>Input</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">number | boolean | object</span></dt>
        <dd>The value, e.g. <code>42</code> or <code>true</code> (= 1). With <i>From the message</i> also several at once:
            <code>{M5: 1, MW3: 42, "N(1;7)": 0, "T1(2;0)": 2000}</code>.</dd>
        <dt class="optional">topic</dt><dd>With <i>From the message</i>: the target, e.g. <code>MW3</code>.</dd>
    </dl>
    <h3>What can be written</h3>
    <ul>
        <li>Markers <code>M</code> (0/1), <code>MB</code> (0–255), <code>MW</code>, <code>MD</code> and NET markers
            <code>N</code>, <code>NB</code>, <code>NW</code>, <code>ND</code> (with NET ID 0–8).</li>
        <li>Function block inputs (firmware 1.20 or later, only in RUN): bit inputs (type 0) must not be connected in
            the program; word inputs (type 2) must be connected to a constant. Times always in milliseconds
            (10 h 20 min = <code>37200000</code>). The change lasts until restart; make it permanent with the action
            <i>Save function block changes</i>.</li>
        <li>Not writable: I, Q, AI, AO, ID.</li>
    </ul>
    <h3>Output</h3>
    <p>The input message with <code>msg.success = true</code> and <code>msg.results</code> (answers of the easyE4).
        Errors go to a <i>catch</i> node.</p>
    <p>If several values for the same operand arrive before the previous one was sent, only the newest is sent
        (all messages are still confirmed).</p>
</script>

<script type="text/html" data-help-name="easye4json-action">
    <p>Runs an action on the easyE4 when a message arrives.</p>
    <h3>Actions</h3>
    <dl class="message-properties">
        <dt>Start RUN / STOP</dt><dd>Switch the operating mode.</dd>
        <dt>Set date + time</dt><dd>Without <code>msg.payload</code> the current time of the Node-RED computer,
            otherwise a timestamp or text like <code>"2026-10-18 12:00:00"</code>. <b>Only in STOP.</b></dd>
        <dt>Change device name</dt><dd>Name from the field or from <code>msg.payload</code>. <b>Only in STOP</b>, only as <code>admin</code>.</dd>
        <dt>Save function block changes</dt><dd>Constants changed via the JSON API are kept after a restart.</dd>
        <dt>Free request</dt><dd><code>msg.payload</code> = API address, e.g. <code>/api/get/data?elm=CYC</code>.</dd>
        <dt>From the message</dt><dd><code>msg.action</code> = <code>run</code>, <code>stop</code>, <code>setClock</code>,
            <code>setDate</code>, <code>setTime</code>, <code>setName</code>, <code>saveFB</code> or <code>request</code>.</dd>
    </dl>
    <h3>Output</h3>
    <dl class="message-properties">
        <dt>success</dt><dd><code>true</code> or <code>false</code>.</dd>
        <dt>payload</dt><dd>Answer of the easyE4 (usually empty).</dd>
        <dt>errorMsg / statusCode</dt><dd>On errors, e.g. 403 = not allowed in this state.</dd>
    </dl>
    <p>The message is also sent on errors so that the flow can react.</p>
</script>
