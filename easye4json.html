<!-- easyE4 über die JSON-API (ältere Geräte ohne MQTT) / easyE4 via the JSON API (older devices without MQTT)
     Texte: locales/<sprache>/easye4json.json, Hilfe: locales/<sprache>/easye4json.html (de, en-US) -->

<!-- ===================== gemeinsame Hilfsfunktionen / shared editor helpers ===================== -->
<script type="text/javascript">
    (function () {
        var NET = /^(N|NB|NW|ND)$/;
        var MAX = { ID: 96, M: 512, MB: 512, MW: 512, MD: 256, N: 512, NB: 64, NW: 32, ND: 16 };
        function val(id, node, key) {
            var $e = $(id);
            return $e.length ? $e.val() : node[key];
        }
        function intOk(v, min, max) {
            var s = String(v === undefined || v === null ? "" : v).trim();
            if (!/^\d+$/.test(s)) return false;
            var n = parseInt(s, 10);
            return n >= min && n <= max;
        }
        function apiType(t) { return t === "Q" ? "O" : t; }

        window.easyE4Json = {
            NET: NET,
            // Element-Text wie er an die easyE4 geht (nur zur Anzeige im Dialog und in der Beschriftung)
            elementText: function (n) {
                var mode = n.mode || "operand";
                var t = apiType(n.opType || "M");
                var net = NET.test(t) ? (n.netId || 0) + ";" : "";
                switch (mode) {
                    case "operand": return t + "(" + net + (n.index || "?") + ")";
                    case "range": return t + "(" + net + (n.index || "?") + "," + (n.rangeEnd || "?") + ")";
                    case "all": return apiType(n.allType || "I");
                    case "sys": return n.sys || "STATE";
                    case "fb": return "FB" + String(n.fbName || "?").toUpperCase() + (n.fbInst || "?") + "(" + (n.fbPinType || 0) + ";" + (n.fbPin || 0) + ")";
                    case "list": return String(n.list || "").split(/[\n]/).join(" ").trim();
                    default: return "";
                }
            },
            shortLabel: function (n) {
                var mode = n.mode || "operand";
                var t = n.opType || "M";
                var net = NET.test(t) ? (n.netId || 0) + ";" : "";
                if (mode === "operand") return NET.test(t) ? t + "(" + net + (n.index || "?") + ")" : t + (n.index || "?");
                if (mode === "range") return t + (n.index || "?") + "–" + t + (n.rangeEnd || "?") + (NET.test(t) ? " @" + (n.netId || 0) : "");
                if (mode === "fb") return String(n.fbName || "?").toUpperCase() + (n.fbInst || "?") + " (" + (n.fbPinType || 0) + ";" + (n.fbPin || 0) + ")";
                var s = easyE4Json.elementText(n);
                if (mode === "all") s = s === "O" ? "Q" : s;
                return s.length > 25 ? s.slice(0, 22) + "..." : s;
            },
            // Validatoren: im geöffneten Dialog zählen die Felder, sonst die gespeicherten Werte
            vIndex: function (v) {
                var m = val("#node-input-mode", this, "mode") || "operand";
                if (m !== "operand" && m !== "range") return true;
                var t = val("#node-input-opType", this, "opType") || "M";
                return intOk(v, 1, MAX[t] || 999);
            },
            vRangeEnd: function (v) {
                var m = val("#node-input-mode", this, "mode") || "operand";
                if (m !== "range") return true;
                var t = val("#node-input-opType", this, "opType") || "M";
                var a = parseInt(val("#node-input-index", this, "index"), 10);
                return intOk(v, 1, MAX[t] || 999) && parseInt(v, 10) >= a;
            },
            vNet: function (v) {
                var m = val("#node-input-mode", this, "mode") || "operand";
                var t = val("#node-input-opType", this, "opType") || "M";
                if ((m !== "operand" && m !== "range") || !NET.test(t)) return true;
                return intOk(v, 0, 8);
            },
            vFbName: function (v) {
                var m = val("#node-input-mode", this, "mode") || "operand";
                if (m !== "fb") return true;
                return /^[A-Za-z]{1,3}$/.test(String(v || "").trim());
            },
            vFbInst: function (v) {
                var m = val("#node-input-mode", this, "mode") || "operand";
                return m !== "fb" || intOk(v, 1, 255);
            },
            vFbPin: function (v) {
                var m = val("#node-input-mode", this, "mode") || "operand";
                return m !== "fb" || intOk(v, 0, 63);
            },
            vList: function (v) {
                var m = val("#node-input-mode", this, "mode") || "operand";
                return m !== "list" || String(v || "").trim().length > 0;
            },
            // Felder je nach Auswahl ein-/ausblenden
            bind: function (node, isWrite) {
                function update() {
                    var m = $("#node-input-mode").val();
                    var t = $("#node-input-opType").val();
                    var opMode = m === "operand" || m === "range";
                    $(".e4j-op").toggle(opMode);
                    $(".e4j-net").toggle(opMode && NET.test(t));
                    $(".e4j-end").toggle(m === "range");
                    $(".e4j-all").toggle(m === "all");
                    $(".e4j-sys").toggle(m === "sys");
                    $(".e4j-fb").toggle(m === "fb");
                    $(".e4j-list").toggle(m === "list");
                    $(".e4j-poll").toggle(m !== "msg");
                    $(".e4j-fbtip").toggle(m === "fb");
                    var preview = {
                        mode: m, opType: t, netId: $("#node-input-netId").val(), index: $("#node-input-index").val(),
                        rangeEnd: $("#node-input-rangeEnd").val(), allType: $("#node-input-allType").val(),
                        sys: $("#node-input-sys").val(), fbName: $("#node-input-fbName").val(), fbInst: $("#node-input-fbInst").val(),
                        fbPinType: $("#node-input-fbPinType").val(), fbPin: $("#node-input-fbPin").val(), list: $("#node-input-list").val(),
                    };
                    var txt = m === "msg" ? "–" : easyE4Json.elementText(preview);
                    if (isWrite && m === "operand") txt = "/api/set/op?op=" + t + "&index=" + (preview.index || "?") + (NET.test(t) ? "&netid=" + (preview.netId || 0) : "") + "&val=…";
                    if (isWrite && m === "fb") txt = "/api/set/par?op=FB&v1=" + String(preview.fbName || "?").toUpperCase() + (preview.fbInst || "?") + "(" + preview.fbPinType + ";" + (preview.fbPin || 0) + ";…)";
                    if (!isWrite && m !== "msg") txt = "elm=" + txt;
                    $("#e4j-preview").text(txt);
                    $("#node-input-index, #node-input-rangeEnd, #node-input-netId, #node-input-fbName, #node-input-fbInst, #node-input-fbPin, #node-input-list").trigger("validate");
                }
                $("#node-input-mode, #node-input-opType, #node-input-allType, #node-input-sys, #node-input-fbPinType").on("change", update);
                $("#node-input-index, #node-input-rangeEnd, #node-input-netId, #node-input-fbName, #node-input-fbInst, #node-input-fbPin, #node-input-list").on("input change", update);
                update();
            },
        };
    })();
</script>

<!-- ===================== Steuerung (Konfiguration) ===================== -->
<script type="text/javascript">
    RED.nodes.registerType("easye4json-device", {
        category: "config",
        defaults: {
            name: { value: "" },
            host: { value: "", required: true },
            protocol: { value: "http" },
            port: { value: "", validate: function (v) { return v === "" || v === undefined || (/^\d+$/.test(String(v)) && +v > 0 && +v < 65536); } },
            verifyCert: { value: false },
            auth: { value: "basic" },
            readPath: { value: "auto" },
            timeout: { value: 3000, validate: RED.validators.number() },
            gap: { value: 50, validate: function (v) { return v === undefined || v === "" || (/^\d+$/.test(String(v)) && +v <= 5000); } },
        },
        credentials: {
            user: { type: "text" },
            password: { type: "password" },
            apikey: { type: "password" },
        },
        label: function () {
            return this.name || ("easyE4 " + (this.host || "JSON"));
        },
        paletteLabel: "easyE4 JSON",
        oneditprepare: function () {
            var node = this;
            function update() {
                var a = $("#node-config-input-auth").val();
                $(".e4j-basic").toggle(a === "basic");
                $(".e4j-bearer").toggle(a === "bearer");
                $(".e4j-https").toggle($("#node-config-input-protocol").val() === "https");
                $("#node-config-input-port").attr("placeholder", $("#node-config-input-protocol").val() === "https" ? "443" : "80");
            }
            $("#node-config-input-auth, #node-config-input-protocol").on("change", update);
            update();

            $("#e4j-test").on("click", function (ev) {
                ev.preventDefault();
                var $r = $("#e4j-test-result");
                $r.css("color", "").text(node._("easye4json.test.running"));
                var body = {
                    id: node.id,
                    host: $("#node-config-input-host").val(),
                    protocol: $("#node-config-input-protocol").val(),
                    port: $("#node-config-input-port").val(),
                    verifyCert: $("#node-config-input-verifyCert").is(":checked"),
                    auth: $("#node-config-input-auth").val(),
                    readPath: $("#node-config-input-readPath").val(),
                    timeout: $("#node-config-input-timeout").val(),
                    user: $("#node-config-input-user").val(),
                    password: $("#node-config-input-password").val(),
                    apikey: $("#node-config-input-apikey").val(),
                    gap: $("#node-config-input-gap").val(),
                    lang: RED.i18n.lang(),
                };
                $.ajax({
                    url: "easye4json/test",
                    type: "POST",
                    contentType: "application/json",
                    data: JSON.stringify(body),
                    success: function (res) {
                        $r.css("color", res.ok ? "#3a3" : "#c33").text(res.text);
                    },
                    error: function (xhr) {
                        $r.css("color", "#c33").text(node._("easye4json.test.failed") + ": " + (xhr.responseText || xhr.status));
                    },
                });
            });
        },
    });
</script>

<script type="text/javascript">
    RED.nodes.registerType("easye4json-read", {
        category: "easyE4",
        color: "#a6bbcf",
        defaults: {
            name: { value: "" },
            device: { type: "easye4json-device", required: true },
            mode: { value: "operand" },
            opType: { value: "M" },
            netId: { value: 0, validate: easyE4Json.vNet },
            index: { value: 1, validate: easyE4Json.vIndex },
            rangeEnd: { value: 8, validate: easyE4Json.vRangeEnd },
            allType: { value: "I" },
            sys: { value: "STATE" },
            fbName: { value: "T", validate: easyE4Json.vFbName },
            fbInst: { value: 1, validate: easyE4Json.vFbInst },
            fbPinType: { value: "1" },
            fbPin: { value: 0, validate: easyE4Json.vFbPin },
            list: { value: "", validate: easyE4Json.vList },
            interval: { value: 1, validate: function (v) { var s = String(v === undefined ? "" : v).trim().replace(",", "."); return /^\d+(\.\d+)?$/.test(s) && (+s === 0 || +s >= 0.5); } },
            onlyChange: { value: false },
        },
        inputs: 1,
        outputs: 1,
        icon: "font-awesome/fa-sign-in",
        label: function () {
            if (this.name) return this.name;
            if (this.mode === "msg") return this._("easye4json.read.label");
            return this._("easye4json.read.label") + ": " + easyE4Json.shortLabel(this);
        },
        paletteLabel: function () { return this._("easye4json.read.paletteLabel"); },
        inputLabels: function () { return this._("easye4json.read.input"); },
        outputLabels: function () { return this._("easye4json.read.output"); },
        oneditprepare: function () { easyE4Json.bind(this, false); },
    });
</script>

<!-- ===================== easyE4 JSON aktion ===================== -->
<script type="text/javascript">
    (function () {
        var ACTIONS = ["msg", "run", "stop", "setClock", "setDate", "setTime", "setName", "saveFB", "request"];
        RED.nodes.registerType("easye4json-action", {
            category: "easyE4",
            color: "#a6bbcf",
            defaults: {
                name: { value: "" },
                device: { type: "easye4json-device", required: true },
                action: { value: "stop" },
                devName: { value: "" },
            },
            inputs: 1,
            outputs: 1,
            icon: "font-awesome/fa-bolt",
            label: function () {
                var l = ACTIONS.indexOf(this.action) >= 0 ? this._("easye4json.action.label." + this.action) : this.action;
                return this.name || "easyE4: " + l;
            },
            paletteLabel: function () { return this._("easye4json.action.paletteLabel"); },
            inputLabels: function () { return this._("easye4json.action.input"); },
            outputLabels: function () { return this._("easye4json.action.output"); },
            oneditprepare: function () {
                var node = this;
                function update() {
                    var a = $("#node-input-action").val();
                    $(".e4j-name-row").toggle(a === "setName");
                    $("#e4j-action-tip").html(ACTIONS.indexOf(a) >= 0 ? node._("easye4json.action.tip." + a) : "");
                }
                $("#node-input-action").on("change", update);
                update();
            },
        });
    })();
</script>

<script type="text/html" data-template-name="easye4json-action">
